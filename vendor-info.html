                        <div class="cs-flex">
                            <span class="cs-button-text">What is Shop the PL?</span>
                            <p class="cs-item-p">
                                Shop the PL is an independent online marketplace created to highlight local and independent businesses & non profits, artists & creators, and awesome humans - while supporting our vendors by offering a lower marketplae fee for sales. 
                            </p>
                        </div>
                        <img class="cs-icon" loading="lazy" decoding="async" src="https://csimg.nyc3.cdn.digitaloceanspaces.com/Images/Icons/arrow-dwon2.svg" alt="icon" width="24" height="24"/>
                    </button>
                </li>
                <li class="cs-faq-item">
                    <button class="cs-button">
                        <div class="cs-flex">
                            <span class="cs-button-text">Can anyone be a vendor?</span>
                            <p class="cs-item-p">
                                Not anyone nor everyone can be a vendor with Shop the PL. You must be independently owned/ran, submit the application below, and be approved for vendor onboarding.
                            </p>
                        </div>
                        <img class="cs-icon" loading="lazy" decoding="async" src="https://csimg.nyc3.cdn.digitaloceanspaces.com/Images/Icons/arrow-dwon2.svg" alt="icon" width="24" height="24"/>
                    </button>
                </li>
                <li class="cs-faq-item">
                    <button class="cs-button">

                            <span class="cs-button-text">Why do I need to apply to be a vendor? </span>
                            <p class="cs-item-p">
                                As an independent marketplace, we have the power to combat the issues seen with larger marketplaces, such as saturation of like vendors and dropshippers.
                            </p>
                        </div>
                        <img class="cs-icon" loading="lazy" decoding="async" src="https://csimg.nyc3.cdn.digitaloceanspaces.com/Images/Icons/arrow-dwon2.svg" alt="icon" width="24" height="24"/>
                    </button>
                </li>
                <li class="cs-faq-item">
                    <button class="cs-button">
                        <div class="cs-flex">
                            <span class="cs-button-text">I've never sold online, is Shop the Pl right for me?</span>
                            <p class="cs-item-p">
                                Absolutely! Shop the PL offers a more personal experience when starting your online selling. You'll receive assistance with setting up your vendor account and your products
                            </p>
                        </div>

                    </button>
                </li>
            </ul>

                            <span class="cs-button-text">I already have an online shop, can I still be a vendor?</span>
                            <p class="cs-item-p">
                                Absolutely! Shop the PL can be an additional sales funnel to your overall sales. Whether Shop the PL is the only platform you sell on or one of many, is up to you!
                            </p>
                        </div>
                        <img class="cs-icon" loading="lazy" decoding="async" src="https://csimg.nyc3.cdn.digitaloceanspaces.com/Images/Icons/arrow-dwon2.svg" alt="icon" width="24" height="24"/>
                    </button>
                </li>
                <li class="cs-faq-item">
                    <button class="cs-button">
                        <div class="cs-flex">
                            <span class="cs-button-text">What features/benefits do I have as a vendor?</span>
                            <p class="cs-item-p">
                                Shop the PL has a lot of the basic functionality that other selling platforms have. You will have your own vendor admin account where you can add products for sale and manage customer interactions and sales. 
                            </p>
                        </div>
                        <img class="cs-icon" loading="lazy" decoding="async" src="https://csimg.nyc3.cdn.digitaloceanspaces.com/Images/Icons/arrow-dwon2.svg" alt="icon" width="24" height="24"/>

                </li>

                                10% is th
                            </p>
                        </div>

                    </button>
                </li>
                <li class="cs-faq-item">
                    <button class="cs-button">
                        <div class="cs-flex">
                            <span class="cs-button-text">How do I get paid?</span>
                            <p class="cs-item-p">
                                Payment Processing is handled by Stripe. You will be required to create a Stripe connected account so that you can get your payouts with ease. For every sale, the platform and processing fee will be collected and the remaining amount will be sent to you. You will be responsible for any and all payment transactions with your customers, including refunds and/or disputes. 
                                A 1099 will be provided for the platform sales. You are responsible for reporting and filing all sales tax. 
                            </p>
                        </div>
                        <img class="cs-icon" loading="lazy" decoding="async" src="https://csimg.nyc3.cdn.digitaloceanspaces.com/Images/Icons/arrow-dwon2.svg" alt="icon" width="24" height="24"/>
                    </button>
                </li>
